<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAD AI</title>
<!-- Vercel Speed Insights -->
<script type="module">
  import { injectSpeedInsights } from 'https://cdn.jsdelivr.net/npm/@vercel/speed-insights@1/dist/index.mjs';
  injectSpeedInsights();
</script>
<style>
:root{color-scheme:dark;--hf:"Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--bg:#031b1e;--pn:#072a2f;--ink:#e8f4f6;--mut:#9db8bd;--ln:#1f5057;--ac:#19e6d0;--acx:#022126;--er:#ff7a8a;--ok:#4fd1a1;--sv:#e6f4f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3,.brand{font-family:var(--hf);letter-spacing:-.015em;margin:0}
h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.08}h2{font-size:1.5rem}h3{font-size:1.1rem}
a{color:var(--ac)}p{margin:.4em 0}.mut{color:var(--mut)}.sm{font-size:.85rem}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
nav{display:flex;align-items:center;gap:14px;padding:14px 18px;max-width:1000px;margin:0 auto;flex-wrap:wrap}
nav .sp{flex:1}.brand{font-size:1.4rem;font-weight:700;cursor:pointer}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--pn);color:var(--ink);padding:8px 14px;border-radius:6px}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.l{border:0;background:none;color:var(--ac);padding:4px 6px}button.d{color:var(--er)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--ln);border-radius:6px;background:var(--pn);color:var(--ink)}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:20px}
.auth{max-width:400px;margin:40px auto}
.flash{margin:8px auto;max-width:1000px;padding:10px 18px;border-left:4px solid var(--ok);background:var(--pn)}
.flash.err{border-color:var(--er)}.flash.warn{border-color:#d98a00}
.hero{padding:70px 0 40px;max-width:720px}.hero p{font-size:1.15rem;color:var(--mut);margin:16px 0 24px}.hero button{margin-right:8px}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin:8px 0 20px}
.g b{font-size:1.5rem;font-family:var(--hf)}.bar{height:14px;background:var(--bg);border:1px solid var(--ln);border-radius:2px;margin:6px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}.bar.hot i{background:var(--er)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 14px}
.tabs button.on{border-color:var(--ac);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>input,.row>select{flex:1;min-width:140px;width:auto}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.done .t{text-decoration:line-through;color:var(--mut)}
.msgs{height:52vh;min-height:280px;overflow-y:auto;padding:4px 2px;margin-bottom:12px}
.m{max-width:85%;padding:9px 13px;border-radius:8px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{margin-left:auto;background:var(--ac);color:var(--acx)}.m.a{background:var(--pn);border:1px solid var(--ln)}
pre{background:var(--bg);border:1px solid var(--ln);padding:12px;border-radius:6px;overflow:auto;white-space:pre-wrap;max-height:420px;font-size:.85rem}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:12px 0 28px}
.plans .box{display:flex;flex-direction:column;gap:6px}.plans ul{padding-left:18px;margin:6px 0 12px;flex:1}.plans .cur{border:2px solid var(--ac)}
@media(max-width:560px){.m{max-width:95%}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}

/* MAD AI: teal + silver glow + hologram */
body{background:radial-gradient(1100px 520px at 72% -8%,rgba(25,230,208,.16),transparent 70%),radial-gradient(700px 400px at 0% 100%,rgba(230,244,247,.05),transparent 70%),var(--bg);background-attachment:fixed}
h1{background:linear-gradient(180deg,#fff,#c3dce1 55%,#7fa9b0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(25,230,208,.28))}
.brand{font-weight:800;letter-spacing:.14em;color:var(--sv);text-shadow:0 0 14px rgba(230,244,247,.55),0 0 28px rgba(25,230,208,.4)}
.box,.flash{border-color:rgba(230,244,247,.2);box-shadow:0 0 0 1px rgba(230,244,247,.05),0 0 26px rgba(25,230,208,.06)}
button.p{box-shadow:0 0 18px rgba(25,230,208,.35)}
button{border-color:rgba(230,244,247,.28)}
.bar i{background:linear-gradient(90deg,var(--ac),var(--sv));box-shadow:0 0 10px rgba(25,230,208,.6)}.bar.hot i{background:var(--er);box-shadow:0 0 10px var(--er)}
.plans .cur{border:2px solid var(--ac);box-shadow:0 0 30px rgba(25,230,208,.28)}
.hero2{display:flex;align-items:center;justify-content:center;gap:34px;flex-wrap:wrap}.hero2 .hero{flex:1 1 380px}
.holo{position:relative;width:250px;height:250px;flex:none;filter:drop-shadow(0 0 22px rgba(25,230,208,.5))}
.holo i{position:absolute;border-radius:50%}
.holo .r1{inset:0;background:conic-gradient(#19e6d0,#e6f4f7,#19e6d0 30%,#7fd8e8,#e6f4f7 62%,#19e6d0);-webkit-mask:radial-gradient(circle,transparent 64%,#000 65% 68%,transparent 69%);mask:radial-gradient(circle,transparent 64%,#000 65% 68%,transparent 69%);animation:spin 14s linear infinite}
.holo .r2{inset:24px;background:conic-gradient(from 180deg,transparent,#e6f4f7,transparent 42%,#19e6d0,transparent 82%);-webkit-mask:radial-gradient(circle,transparent 70%,#000 71% 75%,transparent 76%);mask:radial-gradient(circle,transparent 70%,#000 71% 75%,transparent 76%);animation:spin 9s linear infinite reverse}
.holo .core{position:absolute;inset:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,rgba(230,244,247,.95),rgba(25,230,208,.6) 42%,rgba(25,230,208,.1) 72%);box-shadow:0 0 44px rgba(25,230,208,.55),inset 0 0 26px rgba(230,244,247,.55);animation:float 5s ease-in-out infinite}
.holo .core span{font:800 2.1rem/1 var(--hf);color:var(--acx);letter-spacing:.08em}
.holo .scan{inset:12px;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(230,244,247,.16) 3px 4px);-webkit-mask:radial-gradient(circle,#000 58%,transparent 72%);mask:radial-gradient(circle,#000 58%,transparent 72%);animation:scan 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-9px)}}@keyframes scan{to{background-position:0 16px}}
@media(prefers-reduced-motion:reduce){.holo *{animation:none!important}}
</style></head>
<body><div id="app"></div>
<script>
const root=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n).toLocaleString();
let me,page,plans,flash,S={tab:"chat",msgs:[],conv:null,convs:[],tasks:null,allow:null,projects:null,org:null,open:null,busy:null,v:null};

async function api(p,o={}){
  const r=await fetch("/api"+p,{method:o.method||"GET",credentials:"include",headers:o.body?{"Content-Type":"application/json"}:{},body:o.body?JSON.stringify(o.body):undefined});
  let d=null;try{d=await r.json()}catch{}
  if(!r.ok){const e=new Error(d?.error||"Something went wrong. Try again.");e.code=d?.code;e.status=r.status;throw e}
  return d;
}
const go=p=>{history.pushState(0,"",p);return route()};
const notify=(t,m,up)=>{flash={t,m,up};draw()};
function fail(e){
  if(e.status===401&&me){me=null;return go("/login").then(()=>notify("err","Your session ended. Log in again."))}
  notify(e.code==="EMAIL_NOT_VERIFIED"?"warn":"err",e.message,["TASK_LIMIT","BUILD_LIMIT","CHAT_LIMIT","PROJECT_LIMIT","SEAT_LIMIT","UPGRADE_REQUIRED"].includes(e.code));
}
const refresh=async()=>{me=await api("/auth/me")};

async function route(){
  if(me===undefined)me=await api("/auth/me").catch(()=>null);
  const p=location.pathname.replace(/\/+$/,"")||"/";page=p;flash=null;
  if(p==="/dashboard"){
    const c=new URLSearchParams(location.search).get("checkout");
    await go("/app");
    if(c)notify("ok",c==="madpack"?"Mad Pack purchased. Your credits will appear in a few seconds.":"Thanks! Your plan will update in a few seconds.");
    return;
  }
  if(me&&["/","/login","/signup","/forgot-password"].includes(p))return go("/app");
  if(!me&&p==="/app")return go("/login");
  if(p==="/pricing")plans=await api("/billing/plans").catch(()=>null);
  if(p==="/verify-email"){
    S.v=null;draw();
    try{await api("/auth/verify-email",{method:"POST",body:{token:new URLSearchParams(location.search).get("token")}});if(me)await refresh();S.v="ok"}catch(e){S.v=e.message}
  }
  if(p==="/app")await loadTab();
  draw();
}
async function loadTab(){
  try{
    await refresh();
    if(S.tab==="chat")S.convs=(await api("/ai/conversations")).conversations;
    if(S.tab==="tasks"){const r=await api("/tasks");S.tasks=r.tasks;S.allow=r.allowance}
    if(S.tab==="projects")S.projects=(await api("/projects")).projects;
    if(S.tab==="team")S.org=await api("/org");
  }catch(e){fail(e)}
}

/* ---------- views ---------- */
const nav=()=>`<nav><span class="brand" data-a="go" data-to="${me?"/app":"/"}">MAD AI</span><span class="sp"></span>
 <button class="l" data-a="go" data-to="/pricing">Pricing</button>
 ${me?`<button class="l" data-a="go" data-to="/app">Dashboard</button><button class="l" data-a="logout">Log out</button>`
 :`<button class="l" data-a="go" data-to="/login">Log in</button><button class="p" data-a="go" data-to="/signup">Sign up free</button>`}</nav>`;
const flashH=()=>flash?`<div class="flash ${flash.t}" role="alert">${esc(flash.m)}${flash.up?` <button class="l" data-a="go" data-to="/pricing">Get a Mad Pack or upgrade</button>`:""}</div>`:"";
const field=(n,l,t="text",extra="")=>`<label for="${n}">${l}</label><input id="${n}" name="${n}" type="${t}" ${extra} required>`;
const authBox=(title,form,foot)=>`<div class="auth box"><h2>${title}</h2>${form}<p class="sm mut" style="margin-top:16px">${foot}</p></div>`;

const views={
  "/":()=>`<div class="wrap hero2"><div class="hero"><h1>Describe it. MAD AI builds it.</h1>
   <p>Websites, apps, code and business plans, plus a task list that keeps up. Free to start, and you only pay when you need more.</p>
   <button class="p" data-a="go" data-to="/signup">Create free account</button><button data-a="go" data-to="/pricing">See pricing</button></div><div class="holo" aria-hidden="true"><i class="r1"></i><i class="r2"></i><div class="core"><span>AI</span></div><i class="scan"></i></div></div>`,
  "/login":()=>authBox("Log in",`<form data-f="login">${field("email","Email","email",'autocomplete="email"')}${field("password","Password","password",'autocomplete="current-password"')}<p style="margin-top:16px"><button class="p">Log in</button></p></form>`,
    `<a href="/forgot-password" data-a="go" data-to="/forgot-password">Forgot password?</a> · New here? <a href="/signup" data-a="go" data-to="/signup">Create an account</a>`),
  "/signup":()=>authBox("Create your account",`<form data-f="signup">${field("name","Name","text",'autocomplete="name"')}${field("email","Email","email",'autocomplete="email"')}${field("password","Password","password",'autocomplete="new-password" minlength="10"')}<p class="sm mut">10+ characters with upper case, lower case and a number.</p><p><button class="p">Sign up</button></p></form>`,
    `Already have an account? <a href="/login" data-a="go" data-to="/login">Log in</a>`),
  "/forgot-password":()=>authBox("Reset your password",`<form data-f="forgot">${field("email","Email","email")}<p style="margin-top:16px"><button class="p">Email me a reset link</button></p></form>`,`<a href="/login" data-a="go" data-to="/login">Back to log in</a>`),
  "/reset-password":()=>authBox("Choose a new password",`<form data-f="reset">${field("password","New password","password",'autocomplete="new-password" minlength="10"')}<p style="margin-top:16px"><button class="p">Save password</button></p></form>`,`Links expire after 1 hour.`),
  "/verify-email":()=>authBox("Email verification",S.v===null?"<p>Checking your link…</p>":S.v==="ok"?"<p>Your email is verified. Thank you.</p>":`<p>${esc(S.v)}</p>`,`<a href="${me?"/app":"/login"}" data-a="go" data-to="${me?"/app":"/login"}">Continue</a>`),
  "/pricing":()=>{
    if(!plans)return `<div class="wrap"><p>Pricing could not load. Refresh to try again.</p></div>`;
    const card=p=>{const cur=me&&me.plan.key===p.key;
      return `<div class="box ${cur?"cur":""}"><h3>${esc(p.label)}</h3><ul class="sm"><li>${fmt(p.tasksPerMonth)} tasks a month${p.tier==="business"?" per member":""}</li><li>${fmt(p.buildsPerMonth)} builds a month</li><li>${fmt(p.chatPerDay)} chats a day</li><li>${fmt(p.projects)} active projects</li><li>${p.buildKinds.length>1?"Websites, apps and code":"Website builds"}</li>${p.seats>1?`<li>${p.seats} team seats</li>`:""}</ul>
      ${cur?`<button disabled>Current plan</button>`:p.key==="free"?`<button data-a="go" data-to="${me?"/app":"/signup"}">${me?"Free plan":"Start free"}</button>`:p.available?`<button class="p" data-a="sub" data-id="${p.key}">Choose ${esc(p.label)}</button>`:`<button disabled>Not available yet</button>`}</div>`};
    const personal=plans.plans.filter(p=>p.tier==="consumer"),biz=plans.plans.filter(p=>p.tier==="business");
    return `<div class="wrap"><h1 style="font-size:2.4rem">Pricing</h1><p class="mut">Allowances reset on the 1st of each month. Out early? A Mad Pack adds credits instantly.</p>
     <h2 style="margin-top:24px">Personal</h2><div class="plans">${personal.map(card).join("")}</div>
     <h2>Business</h2><p class="mut sm">Owners add teammates by email. Every member gets the full allowance.</p><div class="plans">${biz.map(card).join("")}</div>
     <h2>Mad Packs</h2><p class="mut sm">One-time purchase. Used after your monthly allowance runs out. Never expires.</p>
     <div class="plans">${plans.madPacks.map(m=>`<div class="box"><h3>${esc(m.label)}</h3><p>+${fmt(m.tasks)} tasks<br>+${fmt(m.builds)} builds</p>${m.available?`<button class="p" data-a="pack" data-id="${m.key}">Buy ${esc(m.label)}</button>`:`<button disabled>Not available yet</button>`}</div>`).join("")}</div></div>`;
  },
  "/app":()=>{
    const u=me.usage,L=me.plan.limits,c=me.madPackCredits;
    const gauge=(l,used,lim,cr,unit)=>{const pct=Math.min(100,used/lim*100);return `<div class="box g"><span class="sm mut">${l}</span><br><b>${fmt(used)}</b> <span class="mut">of ${fmt(lim)}${unit}</span><div class="bar ${pct>=90?"hot":""}"><i style="width:${pct}%"></i></div>${cr!==null?`<span class="sm mut">${fmt(cr)} Mad Pack credits left</span>`:`<span class="sm mut">Resets daily</span>`}</div>`};
    const tabs=[["chat","Chat"],["tasks","Tasks"],["projects","Projects"],["team","Team"],["billing","Billing"]];
    return `<div class="wrap">
     ${!me.user.emailVerified?`<div class="flash warn" style="margin:0 0 14px;max-width:none">Verify your email to purchase plans. Check your inbox. <button class="l" data-a="resend">Send again</button></div>`:""}
     <div class="row" style="justify-content:space-between;margin-bottom:6px"><h2>Hi, ${esc(me.user.name.split(" ")[0])}</h2><span class="mut sm">${esc(me.plan.label)} plan${me.org?` · ${esc(me.org.name)}`:""}</span></div>
     <div class="gauges">${gauge("Tasks this month",u.tasksThisMonth,L.tasksPerMonth,c.tasks," tasks")}${gauge("Builds this month",u.buildsThisMonth,L.buildsPerMonth,c.builds," builds")}${gauge("Chats today",u.chatToday,L.chatPerDay,null," chats")}</div>
     <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="${S.tab===k?"on":""}" data-a="tab" data-id="${k}">${l}</button>`).join("")}</div>${tabBody()}</div>`;
  },
};
function tabBody(){
  if(S.tab==="chat")return `<div class="row" style="margin-bottom:10px"><select data-c="conv" aria-label="Conversation"><option value="">New conversation</option>${S.convs.map(c=>`<option value="${c._id}" ${c._id===S.conv?"selected":""}>${esc(c.title)}</option>`).join("")}</select></div>
   <div class="msgs" aria-live="polite">${S.msgs.length?S.msgs.map(m=>`<div class="m ${m.role==="user"?"u":"a"}">${esc(m.content)}</div>`).join(""):`<p class="mut">Ask for a website, a business plan, a bug fix, anything.</p>`}${S.busy==="chat"?`<div class="m a mut">Thinking…</div>`:""}</div>
   <form data-f="chat" class="row"><textarea name="message" rows="2" maxlength="4000" placeholder="Message MAD AI" required style="flex:1"></textarea><button class="p" ${S.busy?"disabled":""}>Send</button></form>`;
  if(S.tab==="tasks"){const a=S.allow;return `<form data-f="task" class="row"><input name="title" placeholder="New task" maxlength="160" required><select name="priority"><option value="medium">Medium</option><option value="high">High</option><option value="low">Low</option></select><button class="p">Add task</button></form>
   ${a?`<p class="sm mut">${fmt(a.used)} of ${fmt(a.limit)} monthly tasks used${a.bonus?` · ${fmt(a.bonus)} Mad Pack credits`:""} · resets ${new Date(a.resetsAt).toLocaleDateString()}</p>`:""}
   ${S.tasks&&S.tasks.length?S.tasks.map(t=>`<div class="item ${t.completed?"done":""}"><span class="t">${esc(t.title)} <span class="sm mut">${t.priority}</span></span><button class="l" data-a="tdone" data-id="${t._id}" data-v="${t.completed?0:1}">${t.completed?"Reopen":"Done"}</button><button class="l d" data-a="tdel" data-id="${t._id}">Delete</button></div>`).join(""):`<p class="mut">No tasks yet. Add your first one above.</p>`}`}
  if(S.tab==="projects")return `<form data-f="project"><div class="row"><input name="title" placeholder="Project name" maxlength="120" required><select name="kind"><option value="website">Website</option><option value="webapp">Web app</option><option value="code">Code</option><option value="business">Business plan</option><option value="general">General</option></select></div>
   <textarea name="prompt" rows="3" maxlength="8000" placeholder="Describe what you want built" style="margin:8px 0"></textarea><button class="p">Create project</button></form>
   <div style="margin-top:14px">${S.projects&&S.projects.length?S.projects.map(p=>`<div class="item" style="flex-wrap:wrap"><span class="t"><b>${esc(p.title)}</b> <span class="sm mut">${p.kind} · ${p.status}</span></span>
    <button class="p" data-a="build" data-id="${p._id}" ${S.busy?"disabled":""}>${S.busy===p._id?"Building…":p.artifact?"Rebuild":"Build"}</button>
    ${p.artifact?`<button class="l" data-a="pview" data-id="${p._id}">${S.open===p._id?"Hide":"View"}</button>`:""}
    ${p.status!=="complete"?`<button class="l" data-a="pdone" data-id="${p._id}">Mark complete</button>`:""}<button class="l d" data-a="pdel" data-id="${p._id}">Delete</button>
    ${S.open===p._id?`<pre style="width:100%">${esc(p.artifact)}</pre>`:""}</div>`).join(""):`<p class="mut">No projects yet. Create one above, then press Build.</p>`}</div>`;
  if(S.tab==="team"){const o=S.org&&S.org.org;if(!o)return `<div class="box"><h3>Teams</h3><p class="mut">Team, Business and Growth plans let you add teammates who share your plan's allowances.</p><button class="p" data-a="go" data-to="/pricing">See business plans</button></div>`;
   return `<div class="box"><h3>${esc(o.name)}</h3><p class="sm mut">${o.seatsUsed} of ${o.seats} seats used · ${esc(o.plan)} plan</p>
    ${S.org.members.map(m=>`<div class="item"><span class="t">${esc(m.name)} <span class="sm mut">${esc(m.email)}${m.isOwner?" · owner":""}</span></span>${o.isOwner&&!m.isOwner?`<button class="l d" data-a="mrem" data-id="${m.id}">Remove</button>`:""}</div>`).join("")}
    ${o.isOwner?`<form data-f="member" class="row" style="margin-top:14px"><input name="email" type="email" placeholder="Teammate's email (they need a verified account)" required><button class="p">Add member</button></form>`:`<p><button class="d" data-a="leave">Leave team</button></p>`}</div>`}
  if(S.tab==="billing"){const s=me.subscription;return `<div class="box"><h3>${esc(me.plan.label)} plan</h3>
   <p class="mut">${s.status?`Status: ${esc(s.status)}${s.currentPeriodEnd?` · ${s.cancelAtPeriodEnd?"ends":"renews"} ${new Date(s.currentPeriodEnd).toLocaleDateString()}`:""}`:"No paid subscription."}</p>
   <p class="mut">Mad Pack credits: ${fmt(me.madPackCredits.tasks)} tasks, ${fmt(me.madPackCredits.builds)} builds. Monthly allowances reset ${new Date(me.monthlyResetsAt).toLocaleDateString()}.</p>
   <div class="row">${s.status?`<button class="p" data-a="portal">Manage or cancel subscription</button>`:""}<button data-a="go" data-to="/pricing">${s.status?"Compare plans":"Upgrade or buy a Mad Pack"}</button></div></div>
   <div class="box" style="margin-top:14px"><h3>Security</h3><p class="mut sm">Signs you out on every device.</p><button data-a="logoutall">Sign out everywhere</button></div>`}
  return "";
}
function draw(){
  const v=views[page]||views["/"];
  root.innerHTML=nav()+flashH()+(page==="/app"&&!me?"":v());
  const m=root.querySelector(".msgs");if(m)m.scrollTop=m.scrollHeight;
}

/* ---------- forms ---------- */
const F={
  async login(d){await api("/auth/login",{method:"POST",body:d});await refresh();await go("/app")},
  async signup(d){await api("/auth/signup",{method:"POST",body:d});await refresh();await go("/app")},
  async forgot(d){await api("/auth/forgot-password",{method:"POST",body:d});notify("ok","If that email has an account, a reset link is on its way.")},
  async reset(d){await api("/auth/reset-password",{method:"POST",body:{token:new URLSearchParams(location.search).get("token"),newPassword:d.password}});await go("/login");notify("ok","Password updated. Log in with your new password.")},
  async chat(d,f){
    const text=d.message.trim();if(!text||S.busy)return;
    S.msgs.push({role:"user",content:text});S.busy="chat";draw();
    try{
      const r=await api("/ai/chat",{method:"POST",body:{message:text,conversationId:S.conv||undefined}});
      S.msgs.push({role:"assistant",content:r.message});S.conv=r.conversationId;
      S.convs=(await api("/ai/conversations")).conversations;await refresh();
    }catch(e){S.msgs.pop();S.busy=null;throw e}
    S.busy=null;draw();
  },
  async task(d){await api("/tasks",{method:"POST",body:d});await loadTab();draw()},
  async project(d){await api("/projects",{method:"POST",body:d});await loadTab();draw()},
  async member(d){await api("/org/members",{method:"POST",body:d});await loadTab();draw();notify("ok","Member added.")},
};
root.addEventListener("submit",async e=>{
  const f=e.target.dataset.f;if(!f)return;e.preventDefault();
  try{await F[f](Object.fromEntries(new FormData(e.target)),e.target)}catch(x){S.busy=null;fail(x)}
});

/* ---------- actions ---------- */
const redirect=async(path,body)=>{const r=await api(path,{method:"POST",body});location.href=r.url};
const reload=async()=>{await loadTab();draw()};
const A={
  go:b=>go(b.to),
  async logout(){await api("/auth/logout",{method:"POST"});me=null;S={...S,msgs:[],conv:null,tasks:null,projects:null,org:null};await go("/")},
  async logoutall(){await api("/auth/logout-all",{method:"POST"});me=null;await go("/login")},
  async tab(b){S.tab=b.id;await reload()},
  async resend(){await api("/auth/resend-verification",{method:"POST"});notify("ok","Verification email sent.")},
  async tdone(b){await api("/tasks/"+b.id,{method:"PATCH",body:{completed:b.v==="1"}});await reload()},
  async tdel(b){await api("/tasks/"+b.id,{method:"DELETE"});await reload()},
  async pview(b){S.open=S.open===b.id?null:b.id;draw()},
  async pdone(b){await api("/projects/"+b.id,{method:"PATCH",body:{status:"complete"}});await reload()},
  async pdel(b){if(!confirm("Delete this project?"))return;await api("/projects/"+b.id,{method:"DELETE"});await reload()},
  async build(b){
    S.busy=b.id;draw();
    try{await api("/projects/"+b.id+"/build",{method:"POST"});S.open=b.id}finally{S.busy=null}
    await reload();
  },
  async mrem(b){await api("/org/members/"+b.id,{method:"DELETE"});await reload()},
  async leave(){if(!confirm("Leave this team?"))return;await api("/org/leave",{method:"POST"});S.tab="billing";await reload()},
  async sub(b){
    if(!me)return go("/signup");
    try{await redirect("/billing/checkout",{plan:b.id})}catch(e){if(e.code==="USE_PORTAL")return redirect("/billing/portal");throw e}
  },
  async pack(b){if(!me)return go("/signup");await redirect("/billing/madpack",{pack:b.id})},
  async portal(){await redirect("/billing/portal")},
};
root.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b||b.tagName==="SELECT")return;
  if(b.tagName==="A")e.preventDefault();
  try{await A[b.dataset.a](b.dataset)}catch(x){S.busy=null;fail(x)}
});
root.addEventListener("change",async e=>{
  if(e.target.dataset.c!=="conv")return;
  S.conv=e.target.value||null;S.msgs=[];
  try{if(S.conv)S.msgs=(await api("/ai/conversations/"+S.conv)).conversation.messages}catch(x){fail(x)}
  draw();
});
window.addEventListener("popstate",route);
route();
</script></body></html>
